description: |
  RhinoCommon + Grasshopper bridge for the rhino-mcp MCP server.
  Loads as a Rhino 8 or Rhino 9 plug-in (separate rh8 / rh9 builds) and
  exposes a JSON-RPC listener over a platform-native transport (named
  pipe on Windows, Unix socket on macOS/Linux, optional TCP). The MCP
  server (separate process) auto-detects the bridge on startup.

  After install — connect your MCP client:
    1. Type "_McpInstall" in the Rhino command line and toggle the
       clients to configure (Claude Desktop, Claude Code, Codex,
       Antigravity), OR
    2. Run "rhino-mcp install --client <name>" from a terminal — see
       {{REPOSITORY_URL}}/blob/main/docs/en/installation.md
  Then restart the configured clients to load the rhino-mcp tools.

  If "uvx" or "python" is missing, "_McpInstall" will offer to install
  uv automatically (with confirmation).
